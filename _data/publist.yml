- title: "XFeat Revisited: Reproducibility and Evaluation of a Lightweight Image Matcher"
  paper_url: "https://openreview.net/pdf?id=2WI889Ulin"
  authors: "**Lazar Đoković**, Aimee Lin"
  venue: "In Transactions on Machine Learning Research (TMLR), 2026"
  description: "We reproduce and re-evaluate XFeat, a lightweight image-matching model designed for efficient feature extraction on resource-constrained hardware. Our experiments recover its strong accuracy–efficiency trade-off on standard benchmarks, while architectural ablations clarify the role of its keypoint branch and skip connection. We also evaluate robustness under out-of-distribution and cross-modal image matching, where performance declines under severe modality shifts."
  image: "/images/papers/xfeat.png"
  image_alt: "Correspondences produced by semi-dense XFeat*."
  links:
    - name: "Arxiv"
      url: "https://arxiv.org/abs/2608.09519v1"
    - name: "Code"
      url: "https://github.com/GalaxyGHz/xfeat-revisited"

- title: "Sarcasm Detection in a Less-Resourced Language"
  paper_url: "https://is.ijs.si/wp-content/uploads/2024/10/SCAI_2024_paper_4212.pdf"
  authors: "**Lazar Đoković**, [Marko Robnik-Šikonja](https://www.fri.uni-lj.si/en/about-faculty/employees/marko-robnik-sikonja)"
  venue: "In the Slovenian Conference on Artificial Intelligence (SCAI), 2024"
  description: "We create a Slovene sarcasm-detection dataset using machine translation and large language models, then evaluate cross-lingual transfer across monolingual and multilingual Transformer models. Our ensemble reaches an F1 score of 0.765."
  image: "/images/papers/sarcasm.jpeg"
  image_alt: "Histogram of character lengths in the Slovene translation of the iSarcasmEval dataset, showing the mean and median lengths"
  links:
    - name: "arXiv"
      url: "https://arxiv.org/abs/2410.12704"
    - name: "Code"
      url: "https://github.com/GalaxyGHz/Diploma"