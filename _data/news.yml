- date: "August 2024"
  headline: "Graduated with a **B.Sc. in Computer and Information Science** from the University of Ljubljana **with a 9.5/10.0 GPA** and a thesis grade of 10/10. [Bachelor Thesis](https://repozitorij.uni-lj.si/Dokument.php?id=189052&lang=slv)"

