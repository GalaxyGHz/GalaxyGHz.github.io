- date: "September 2026"
  headline: "Completed the **Erasmus Mundus Joint Master in Artificial Intelligence with a 9.75/10.0 GPA**, graduating **cum laude**. [LinkedIn Post](https://lnkd.in/p/e_5j9NPB)"

- date: "August 2026"
  headline: "Published [XFeat Revisited: Reproducibility and Evaluation of a Lightweight Image Matcher](https://openreview.net/forum?id=2WI889Ulin) in **TMLR** with a Reproducibility Certification."

- date: "June 2026"
  headline: "Defended my master's thesis at the University of Ljubljana with grade 10/10, presenting **DeMeTer**, a dense memory-based point tracker that achieved a 4.1% relative improvement in δavg over the strongest prior method while operating in real time. [Master Thesis](/docs/Lazar_Dokovic_master_thesis.pdf)"

- date: "April 2026"
  headline: "Received the **Best Poster Award** in the Erasmus Mundus Joint Master in Artificial Intelligence for presenting my research on dense memory-based visual point tracking. [Poster](/docs/Lazar_Dokovic_poster.pdf)"

- date: "September 2025"
  headline: "Completed my **Data Scientist internship at Microsoft**, where I contributed to **Code Copilot**, an agentic AI system for enterprise code understanding and modernization. The system was subsequently used by thousands of engineers. [LinkedIn Post](https://www.linkedin.com/posts/lazar-%C4%91okovi%C4%87_i-am-happy-to-share-that-my-data-scientist-activity-7376669136002834432-mh4l)"

- date: "July 2025"
  headline: "Won **1st place** in the [Programmed Art Competition](https://blogs.ucl.ac.uk/faicdt/2025/08/) organized by **University College London and G-Research** with a visualization of language-model bias using multidimensional random walks."

- date: "February 2025"
  headline: "Joined **Teads as an AI Scientist Intern** to study click-through-rate scaling laws for a production Deep & Cross model using 13.5 million anonymized ad-interaction samples."

